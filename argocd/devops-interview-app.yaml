apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-interview-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rohitison/interview.git
    targetRevision: feature/devops-solution
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-interview

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
