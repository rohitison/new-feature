---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-interview-app
  labels:
    app: devops-interview-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-interview-app
  template:
    metadata:
      labels:
        app: devops-interview-app
    spec:
      containers:
        - name: app
          image: ghcr.io/rohitison/devops-interview-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devops-interview-app
  labels:
    app: devops-interview-app
spec:
  type: ClusterIP
  selector:
    app: devops-interview-app
  ports:
    - name: http
      port: 80
      targetPort: http
